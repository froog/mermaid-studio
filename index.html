<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mermaid Studio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./index.css">
</head>
<body>

<div id="app">
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="logo-group">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
      </svg>
      <span class="logo-text">MERMAID STUDIO</span>
      <button id="help-btn" class="help-btn" title="Help" aria-label="Help">?</button>
    </div>
    <div class="example-bar">
      <select id="example-select" class="example-select" aria-label="Insert example">
        <option value="">Examples</option>
      </select>
    </div>
    <div class="file-bar">
      <button class="example-btn" id="load-btn" title="Upload a .mmd file into a new chat">↑ Upload</button>
      <button class="example-btn" id="download-btn" title="Download editor contents">↓ Download</button>
      <input type="file" id="load-input" accept=".mmd,.txt,text/plain" style="display:none">
    </div>
  </header>

  <!-- Three Panes -->
  <div class="panes">
    <!-- Editor -->
    <div class="editor-pane">
      <div class="pane-header">
        <span class="pane-dot" style="background:var(--orange)"></span>
        <span class="pane-title">EDITOR</span>
        <span class="line-count" id="line-count">0 lines</span>
      </div>
      <div class="editor-wrap">
        <div class="line-numbers" id="line-numbers" aria-hidden="true"></div>
        <textarea id="code-editor" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Preview -->
    <div class="diagram-pane">
      <div class="pane-header">
        <span class="pane-dot" style="background:var(--green)"></span>
        <span class="pane-title">PREVIEW</span>
      </div>
      <div class="diagram-content" id="diagram-content">
        <span class="placeholder">Loading Mermaid…</span>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-pane">
      <div class="pane-header chat-header">
        <span class="pane-dot" style="background:var(--blue)"></span>
        <span class="pane-title">CHAT</span>
        <select id="chat-select" class="chat-select" aria-label="Select chat"></select>
        <button id="chat-new" class="chat-icon-btn" title="New chat">+</button>
        <button id="chat-del" class="chat-icon-btn chat-del-btn" title="Delete chat">×</button>
      </div>
      <div class="chat-scroll" id="chat-scroll"></div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Describe a diagram…">
        <button class="send-btn" id="send-btn">↑</button>
      </div>
    </div>
  </div>
</div>

<div id="help-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="modal-header">
      <span id="help-title" class="modal-title">Help</span>
      <button class="modal-close" data-close aria-label="Close">×</button>
    </div>
    <div id="help-content" class="modal-content markdown-body">Loading…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="./index.js"></script>
</body>
</html>
